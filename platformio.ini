; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare-esp32s3-touch28]
platform = espressif32
board = waveshare-esp32s3-touch28
framework = arduino
lib_extra_dirs = ${sysenv.USERPROFILE}/Documents/Arduino/libraries
lib_deps = 
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@^1.2.7

build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -Isrc
    ; KORRIGIERT: Strings müssen für den Compiler korrekt maskiert werden.
    -D FW_VER="\"2025.09.01\""
    -D GIT_HASH="\"local\""
    -D BUILD_TIME="\""__DATE__" "__TIME__"\""
    -D FW_HASH_HEX="\"407D6B90F4401204499439DCA0961C032B80383DB88AA9C0FB90C5D26CB52B55\""
    ; CI-Schalter
    ; -D CI_FAULT_INJECT_IO=1
    ; -D CI_FORCE_ROTATE_SMALL=1
    ; -D CI_BURST_LOGS=1

upload_speed = 921600
upload_port = COM4
monitor_speed = 115200
monitor_port  = COM4
monitor_filters = time, colorize